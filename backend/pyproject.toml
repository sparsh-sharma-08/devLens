[project]
name = "devlens-backend"
version = "0.1.0"
description = "DevLens AI — Backend API and processing pipeline"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.2",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "httpx>=0.27.0",                   # For OAuth HTTP calls

    # Background jobs
    "celery>=5.4.0",
    "redis>=5.0.0",
    "kombu>=5.3.0",

    # Repository processing
    "gitpython>=3.1.43",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",

    # Embeddings
    "sentence-transformers>=3.0.0",
    "torch>=2.3.0",                    # CPU-only is fine for embeddings

    # LLM providers
    "groq>=0.9.0",
    "anthropic>=0.30.0",
    "openai>=1.35.0",

    # Static analysis
    "ruff>=0.5.0",
    "bandit>=1.7.9",

    # Utilities
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.2.0",               # Structured logging (NFR-10)
    "slowapi>=0.1.9",                  # Rate limiting
    "sentry-sdk[fastapi]>=2.7.0",
    "tenacity>=8.4.0",                 # Retry logic for LLM calls
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
